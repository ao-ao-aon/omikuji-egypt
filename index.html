<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古代エジプト 恋御籤</title>
<style>

    body {
        background-color: #081421;
        color: #d4af37;

        text-align: center;

        font-family: serif;

        margin: 0;
        padding: 0;
    }

    h1 {
        font-size: 50px;

        margin-top: 100px;

        color: #d4af37;

        text-shadow: 0 0 10px #8a6b16;
    }

    p {
        font-size: 22px;

        line-height: 2;

        color: #e8d9a8;
    }

.stone-tablet {

    width: 600px;

    margin: 50px auto;

    padding: 40px;

    background-color: #2b241b;

    border: 6px solid #d4af37;

    border-radius: 10px;

    box-shadow:
        0 0 20px #000,
        inset 0 0 30px #000;
}

h2 {

    font-size: 30px;

    color: #d4af37;

    margin-bottom: 30px;
}

.relationship-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;

    margin-top: 30px;
}

.relationship-buttons button {

    background-color: #3b3020;

    color: #d4af37;

    border: 2px solid #d4af37;

    padding: 20px;

    font-size: 20px;

    font-family: serif;

    cursor: pointer;

    transition: 0.3s;
}

.relationship-buttons button:hover {

    background-color: #d4af37;

    color: #1a1308;

    transform: scale(1.05);
}
#omikuji-screen {
    display: none;
}
/* パピルスを並べる場所 */
.papyrus-container {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 20px;

    margin-top: 40px;
}


/* パピルス本体 */
.papyrus {

    position: relative;

    height: 180px;

    background-color: #c9aa70;

    color: #2b1b0e;

    border: none;

    cursor: pointer;

    font-family: serif;

    font-size: 25px;

    transition: 0.3s;

    box-shadow:
        5px 5px 10px #000,
        inset 0 0 15px #8b6b3d;
}


/* 巻物の上部分 */
.papyrus::before {

    content: "";

    position: absolute;

    top: -10px;

    left: 0;

    width: 100%;

    height: 20px;

    background-color: #9c7b45;

    border-radius: 50%;
}


/* 巻物の下部分 */
.papyrus::after {

    content: "";

    position: absolute;

    bottom: -10px;

    left: 0;

    width: 100%;

    height: 20px;

    background-color: #9c7b45;

    border-radius: 50%;
}


/* マウスを乗せたとき */
.papyrus:hover {

    transform: translateY(-10px) scale(1.05);

    box-shadow:
        0 0 20px #d4af37,
        inset 0 0 15px #8b6b3d;
}


/* ヒエログリフ */
.papyrus-symbol {

    display: block;

    font-size: 55px;

    margin-top: 35px;
}


/* 番号 */
.papyrus-number {

    display: block;

    font-size: 25px;

    margin-top: 15px;
}
#result-screen {
    display: none;
}
@media screen and (max-width: 700px) {

    h1 {
        font-size: 30px;

        margin-top: 40px;

        padding: 0 15px;
    }


    p {
        font-size: 17px;
    }


    .stone-tablet {

        width: auto;

        margin: 20px 15px;

        padding: 25px 15px;

        border-width: 4px;
    }


    h2 {
        font-size: 24px;
    }


    .relationship-buttons {

        grid-template-columns: 1fr;

        gap: 10px;
    }


    .relationship-buttons button {

        padding: 15px;

        font-size: 18px;
    }


    .papyrus-container {

        grid-template-columns: 1fr 1fr;

        gap: 15px;
    }


    .papyrus {

        height: 150px;
    }

}
#god-image {

    width: 250px;

    max-width: 90%;

    height: auto;

    margin: 20px auto;

    display: block;

    border: 3px solid #d4af37;

    box-shadow:
        0 0 15px #000;

}
</style>

</head>

<body>

    <h1>
        𓂀 古代エジプト 恋御籤 𓂀<br>
        حب المنديل في مصر القديمة
    </h1>


    <div class="stone-tablet">


        <!-- 関係性を選ぶ画面 -->
        <div id="relationship-screen">

            <h2>𓁹 汝の恋の状況を示せ 𓁹</h2>

            <p class="question">
                神々は汝の運命を知るため、<br>
                現在の関係を問う。
            </p>


            <div class="relationship-buttons">

                <button onclick="selectRelationship('恋人')">
                    恋人
                </button>

                <button onclick="selectRelationship('失恋中')">
                    失恋中
                </button>

                <button onclick="selectRelationship('片思い')">
                    片思い
                </button>

                <button onclick="selectRelationship('気になる人')">
                    気になる人
                </button>

                <button onclick="selectRelationship('元カレ/元カノ')">
                    元カレ / 元カノ
                </button>

                <button onclick="selectRelationship('好きな人はいない')">
                    好きな人はいない
                </button>

            </div>

        </div>


        <!-- おみくじ選び画面 -->
        <div id="omikuji-screen">

            <h2>𓂀 神々の神託を選べ 𓂀</h2>

            <p>
                目の前に現れた神託の中から、<br>
                一つを選べ。
            </p>


            <div class="papyrus-container">

                <button class="papyrus" onclick="chooseOmikuji(1)">
                    <span class="papyrus-symbol">𓂀</span>
                    <span class="papyrus-number">Ⅰ</span>
                </button>

                <button class="papyrus" onclick="chooseOmikuji(2)">
                    <span class="papyrus-symbol">𓁹</span>
                    <span class="papyrus-number">Ⅱ</span>
                </button>

                <button class="papyrus" onclick="chooseOmikuji(3)">
                    <span class="papyrus-symbol">𓃠</span>
                    <span class="papyrus-number">Ⅲ</span>
                </button>

                <button class="papyrus" onclick="chooseOmikuji(4)">
                    <span class="papyrus-symbol">𓅓</span>
                    <span class="papyrus-number">Ⅳ</span>
                </button>

                <button class="papyrus" onclick="chooseOmikuji(5)">
                    <span class="papyrus-symbol">☥</span>
                    <span class="papyrus-number">Ⅴ</span>
                </button>

                <button class="papyrus" onclick="chooseOmikuji(6)">
                    <span class="papyrus-symbol">𓆣</span>
                    <span class="papyrus-number">Ⅵ</span>
                </button>

            </div>

        </div>


        <!-- 結果表示画面 -->
<div id="result-screen">

    <h2 id="result-title">
        神々の神託
    </h2>


    <!-- 神の画像 -->
    <img id="god-image" src="" alt="神の画像">


    <p id="result-message">
        ここに神託が表示されます。
    </p>


    <div id="god-info">

        <h3 id="god-name">
            神について
        </h3>

        <p id="god-description">
            ここに神の説明が表示されます。
        </p>

    </div>

</div>

    <script>

        /* 選択された関係性 */
        let relationship = "";


        /* おみくじの結果 */
        const omikujiData = {

            "恋人": [
                {
                    title: "ラーの神託",

                },
                {
                    title: "ホルスの神託",

                    godImage: "images/horus.jpg"
                },
                {
                    title: "アヌビスの神託",

                    godName: "アヌビス",
                    godDescription: "ジャッカルの頭を持つ死者の神。<br>死後の楽園へ入る資格があるかを試す者。",
                    godImage: "images/anubis.jpg"

                }
            ],


            "失恋中": [
                {
                    title: "アテンの神託",
                    message: "切り替えるのが大事である。<br>さすれば、次の恋も自然と訪れるであろう。",
                    godName: "アテン",
                    godDescription: "太陽円盤を象徴とする世界最古の類まれな唯一神。<br>その光と熱を万物の創造主・生命の源とした。",
                    godImage: "images/aten.jpg"

                },
                {   title: "オシリスの神託",
                    message: "時間をかけて受け入れるのである。<br>時間をかけて、未練を断ち切るのが大事である。",
                    godName: "オシリス",
                    godDescription: "ラー神によってファラオとして遣わされイシスとともにエジプトの最初の住民を統治した神。<br>賢く、聡明で、慈悲深い神",
                    godImage: "images/oshiris.jpg"

                },
                {   title: "ネフティスの神託",
                    message: "受け入れる必要はないのである。<br>苦悩して成長することも必要である。",
                    godName: "ネフティス",
                    godDescription: "亡くなったエジプト人の石棺を監視する葬儀の女神。<br>イシスに変装してオシリスを誘惑した",
                    godImage: "images/nefteis.jpg"

                }
            ],


            "片思い": [
                {
                    title: "イシスの神託",
                    message: "今すぐにでも思いを伝えるのである。<br>覚悟を決めれば悪い結果には転ばないであろう。",
                    godName: "イシス",
                    godDescription: "魔法と秘密の女神。オシリスの妹であり妻。",
                    godImage: "images/ishis.jpg"

                },
                {   title: "バステトの神託",
                    message: "タイミングを見計らい、ここぞという場面で告白するのである。<br>汝にないものは勇気のみぞ",
                    godName: "バステト",
                    godDescription: "猫、喜び、そして「すべての楽しいこと」の女神。<br>すべての猫はバステトの化身であり、彼女は多くの恩恵を与えると評判だったため、崇拝されてきた。",
                    godImage: "images/bastet.jpg"

                },
                {   title: "セトの神託",
                    message:　"今はまだその時ではない。<br>もう少し関係性を深めてから挑戦するのがよい",
                    godName: "セト",
                    godDescription: "混沌、嵐、砂漠の神。自分と頭の太陽を食べようとする蛇からラーを守るために、毎晩アペプと戦っている。",
                    godImage: "images/set.jpg"

                }
            ],


            "気になる人": [
                {
                    title: "ハトホルの神託",
                    message: "汝が気にしている者はあちら側も気になっているだろう。<br>勇気を出して話しかけるのがよい",

                },
                {   title: "アメンの神託",
                    message: "積極的に行くのが良い。<br>さすれば、相手もだんだんと気になってくるだろう。",
                    godName: "アメン",
                    godDescription: "エジプト文明末期にラーとともに創造神となった。<br>ラーは宇宙を構成するすべての鉱物を創造し、アメンは人間、動物、植物の生命を創造した",
                    godImage: "images/amen.jpg"

                },
                {   title: "セクメトの神託",
                    message: "積極的に行き過ぎないのが良い。<br>強引に行けば相手に距離を置かれてしまうだろう。<br>ゆえに、じわじわと距離を詰めていくのが良い。",
                    godName: "セクメト",
                    godDescription: "ラーの命令でセクメトは地球上のすべての男性、女性、子供を虐殺する。",
                    godImage: "images/sekumet.jpg"

                }
            ],


            "元カレ/元カノ": [
                {
                    title: "オシリスの神託",
                    message: "相手も復縁の機会をうかがっている可能性あり。<br>少しづつ距離感を戻していくのが良い",
                    godName: "オシリス",
                    godDescription: "ラー神によってファラオとして遣わされイシスとともにエジプトの最初の住民を統治した神。<br>賢く、聡明で、慈悲深い神",
                    godImage: "images/oshiris.jpg"

                },
                {   title: "ネフティスの神託",
                    message:"引きずるのもまた良し。<br>苦悩しながら次に切り替えるのが大事である。",
                    godName: "ネフティス",
                    godDescription: "亡くなったエジプト人の石棺を監視する葬儀の女神。<br>イシスに変装してオシリスを誘惑した。",
                    godImage: "images/nefteis.jpg"

                },
                {   title: "アムミットの神託",
                    message: "すぐ切り替えるのが良いだろう。<br>友達としての関係性が一番良い可能性がある。<br>友達として関係性を再構築するのが良い。",
                    godName: "アムミット",
                    godDescription: "アヌビスの近くに来た魂があまりにも罪深いと判断されると、魂を食らう神。<br>その後、魂は「永遠に忘れ去られる」ことになる。",
                    godImage: "images/amumit.jpg"

                }
            ],


            "好きな人はいない": [
                {
                    title: "アテンの神託",
                    message: "これからすぐ運命の人に出会うやもしれぬ。<br>出会った際は猛アピールをするのが良いだろう。",
                    godName: "アテン",
                    godDescription: "太陽円盤を象徴とする世界最古の類まれな唯一神。<br>その光と熱を万物の創造主・生命の源とした。",
                    godImage: "images/aten.jpg"

                },
                {   title: "ラーの神託",
                    message: "心の底にはすでに好きな人がいるはずである。<br>自らの心に正直になってみるのが良いだろう。",
                    godName: "ラー",
                    godDescription: "古代エジプトを代表する太陽神。<br>宇宙とそこに生息するすべての神や人間の生命体の創造者。",
                    godImage: "images/ra-.jpg"

                },
                {   title: "トートの神託",
                    message: "まだ汝が好きになるものはあらわれないだろう。<br>しかし、近いうちにそのようなものと出会うやもしれぬ。",
                    godName: "",
                    godDescription: "トキの頭を持ち、象形文字とすべての科学の発明者であり、書記、知識、学問の神。",
                    godImage: "images/tot.jpg"

                }
            ]

        };


        /* 関係性を選択 */
        function selectRelationship(selectedRelationship) {

            relationship = selectedRelationship;

            document.getElementById("relationship-screen").style.display = "none";

            document.getElementById("omikuji-screen").style.display = "block";

        }


        /* パピルスを選択 */
        function chooseOmikuji(number) {

            const results = omikujiData[relationship];


            const randomNumber = Math.floor(
                Math.random() * results.length
            );


            const result = results[randomNumber];


            document.getElementById("omikuji-screen").style.display = "none";


            document.getElementById("result-screen").style.display = "block";


            /* タイトルを表示 */
            document.getElementById("result-title").textContent = result.title;


            /* 神託を表示 */
            document.getElementById("result-message").innerHTML = result.message;

            /* 神の名前 */
            document.getElementById("god-name").textContent =
            "【" + result.godName + "とは】";


            /* 神の説明 */
            document.getElementById("god-description").textContent =
            result.godDescription;

/* 神の画像 */
document.getElementById("god-image").src = result.godImage;

document.getElementById("god-image").alt =
    result.godName + "の画像";
        }

    </script>

</body>
</html>
